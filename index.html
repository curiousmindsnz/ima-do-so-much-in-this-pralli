<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Number Guessing Game</h1>
        <p class="subtitle">Can you guess the secret number between 1 and 100?</p>
        
        <div class="game-info">
            <div class="info-item">
                <span class="label">Attempts:</span>
                <span id="attempts" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">Best Score:</span>
                <span id="best-score" class="value">-</span>
            </div>
        </div>

        <div class="game-area">
            <input type="number" id="guess-input" min="1" max="100" placeholder="Enter your guess...">
            <button id="guess-button">Guess</button>
        </div>

        <div id="message" class="message"></div>
        <div id="hint" class="hint"></div>

        <button id="reset-button" class="reset-button">New Game</button>

        <div class="history">
            <h3>Guess History</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
